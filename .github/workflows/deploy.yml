name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"   # weekly link check (catch dead project links)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate HTML
        run: npx --yes html-validate@8 "*.html"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude linkedin.com --max-retries 3 --root-dir ${{ github.workspace }} "*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # avoids rate limits on github.com links

  deploy:
    needs: check
    # Off until the repo variable HOSTINGER_DEPLOY is set to "true" (Settings → Secrets and variables → Actions → Variables)
    if: vars.HOSTINGER_DEPLOY == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency: production
    environment:
      name: production
      url: https://diegodiasp.com
    steps:
      - uses: actions/checkout@v5

      - name: Upload to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.HOSTINGER_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .htmlvalidate.json
